name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: CLANKAK-DEV
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?palette=github&color_snake=#0891B2&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
